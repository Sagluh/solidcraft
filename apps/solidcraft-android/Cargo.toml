[package]
name = "solidcraft-android"
description = "Android NativeActivity entry point for SolidCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }
android-activity = { version = "0.6", features = ["native-activity"] }
log = { workspace = true }
android_logger = "0.15"

[package.metadata.android]
package = "dev.solidcraft.matepad"
apk_name = "SolidCraftMatePad"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 30

[package.metadata.android.application]
label = "SolidCraft MatePad"

[lints.rust]
# Android NativeActivity requires the exported android_main symbol.
unsafe_code = "allow"
