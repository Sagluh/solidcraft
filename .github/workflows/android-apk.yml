
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'apps/solidcraft-android/**'
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

          "$SDKMANAGER" --sdk_root="$SDK" --licenses < /dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "platform-tools" \
            "ndk;26.3.11579264"

          NDK="$SDK/ndk/26.3.11579264"
          test -d "$NDK"

          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Install Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Check project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/solidcraft-android/Cargo.toml
          echo "SolidCraft Android Cargo.toml found"
          rustc --version
          cargo --version

      - name: Build APK for Android
        shell: bash
        run: |
          set -euo pipefail
          cd apps/solidcraft-android
          cargo apk build --target aarch64-linux-android

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output

          find . -type f -name "*.apk" \
            -exec cp -v {} apk-output/ \;

          test -n "$(find apk-output -name '*.apk' -print -quit)"

          ls -lh apk-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-apk
          path: apk-output/*.apk
          if-no-files-found: error
