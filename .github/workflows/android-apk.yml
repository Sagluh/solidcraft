name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Platform 30
        run: |
          # Устанавливаем командную строку Android SDK через sdkmanager без лишних экшенов
          sudo apt-get update && sudo apt-get install -y android-sdk
          export ANDROID_HOME="/usr/lib/android-sdk"
          
          # Принимаем лицензии и ставим платформу 30
          yes | sdkmanager --sdk_root=${ANDROID_HOME} --licenses || true
          sdkmanager --sdk_root=${ANDROID_HOME} "platforms;android-30" "build-tools;30.0.3"
          
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV

      - name: Install Rust stable with aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK for Android
        run: |
          cd apps/solidcraft
          cargo apk build --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-apk
          path: target/android/apk/release/*.apk
