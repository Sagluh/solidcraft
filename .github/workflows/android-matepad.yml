name: Build MatePad Web App (PWA)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk via Cargo
        run: cargo install --locked trunk

      - name: Patch wgpu texture limit for Huawei MatePad (4096)
        run: |
          python3 - << 'EOF'
          import pathlib
          for path in pathlib.Path("vendor/egui-wgpu").rglob("*.rs"):
              text = path.read_text()
              if "max_texture_dimension_2d: 8192" in text and "or_worse_values_from" not in text:
                  text = text.replace(
                      "max_texture_dimension_2d: 8192,",
                      "max_texture_dimension_2d: 4100,"
                  )
                  path.write_text(text)
                  print(f"Patched texture limit in {path}")
          EOF

      - name: Build Web App with Trunk
        run: |
          cd apps/solidcraft-web
          trunk build --release --public-url ./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/solidcraft-web/dist

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
